<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1120 0 2240 550" role="img" aria-labelledby="title description">
  <title id="title">Łazik marsjański — dopracowana ilustracja SVG</title>
  <desc id="description">Dopracowana ilustracja SVG marsjańskiego łazika: spójne przeguby i zawieszenie sześciu kół, maszt kamerowy, manipulator i instrumenty. Całość zbudowana z edytowalnych elementów wektorowych.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#695351"/>
      <stop offset=".51" stop-color="#d99b73"/>
      <stop offset="1" stop-color="#f4c18c"/>
    </linearGradient>
    <radialGradient id="haze" cx=".66" cy=".46" r=".7">
      <stop stop-color="#ffdbad" stop-opacity=".76"/>
      <stop offset="1" stop-color="#ffdbad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b27650"/>
      <stop offset="1" stop-color="#663b2b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2=".25" y2="1">
      <stop stop-color="#a46942"/>
      <stop offset=".55" stop-color="#845036"/>
      <stop offset="1" stop-color="#50372c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".92" y2="1">
      <stop stop-color="#f8f1df"/>
      <stop offset=".25" stop-color="#dddcd0"/>
      <stop offset=".58" stop-color="#a5aaa4"/>
      <stop offset="1" stop-color="#5d6562"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2=".9">
      <stop stop-color="#eee9da"/>
      <stop offset=".5" stop-color="#b5b5a9"/>
      <stop offset="1" stop-color="#777f79"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#141b1c"/>
      <stop offset=".4" stop-color="#333c3a"/>
      <stop offset="1" stop-color="#101517"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7b8585"/>
      <stop offset=".55" stop-color="#2c3638"/>
      <stop offset="1" stop-color="#151b1e"/>
    </linearGradient>
    <filter id="ground-shadow" x="-40%" y="-50%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <pattern id="dust" width="89" height="41" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="21" r="1" fill="#f7c797" opacity=".24"/>
      <circle cx="51" cy="9" r="1.4" fill="#412b25" opacity=".21"/>
      <path d="M69 33l9-2" stroke="#efd0aa" opacity=".16"/>
    </pattern>
    <!-- Reusable wheel: exact same geometry for each of the six instances. -->
    <g id="wheel">
      <ellipse cx="6" cy="3" rx="35" ry="45" fill="#101719" opacity=".35"/>
      <ellipse rx="35" ry="47" fill="url(#tire)" stroke="#727a73" stroke-width="2.5"/>
      <path d="M-28-30l14-7M-33-15l16-6M-34 2l17-2M-32 19l16 4M-25 34l14 7M11-42l16 7M20-29l13 10M23-11l11 6M23 9l11 7M15 29l14 7"
            fill="none" stroke="#79817a" stroke-width="4.3" stroke-linecap="round" opacity=".8"/>
      <ellipse rx="24" ry="37" fill="#3b4845" stroke="#bbc0b2" stroke-width="2.5"/>
      <ellipse rx="19" ry="30" fill="#78877e" stroke="#263331" stroke-width="2.7"/>
      <ellipse rx="13" ry="23" fill="#55635e" stroke="#acb6a9" stroke-width="1.5"/>
      <path d="M-10-17L10 17M10-17L-10 17" stroke="#c6cebe" stroke-width="3" stroke-linecap="round" opacity=".88"/>
      <circle r="6.3" fill="#374441" stroke="#e2e3d3" stroke-width="2.2"/>
      <circle r="2.1" fill="#aab7ab"/>
    </g>
    <g id="bolt">
      <circle r="4.5" fill="#5b6663" stroke="#f4eedc" stroke-width="1.3"/>
      <path d="M-2 0h4" stroke="#2e3939" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Landscape: independent vector shapes, no embedded raster. -->
  <rect x="-1120" width="2240" height="550" fill="url(#sky)"/>
  <rect x="-1120" width="2240" height="550" fill="url(#haze)"/>
  <!-- Each terrain layer spans the entire panorama with a single continuous fill. -->
  <g fill="#ffe6bd" opacity=".38">
    <path d="M-950 114l63-6 48 5 21 8-101-4zM-640 77l42-6 56 4-24 5zM-300 102l80-8 59 7-41 8z"/>
    <path d="M55 114l63-6 48 5 21 8-101-4zM364 77l42-6 56 4-24 5zM625 102l80-8 59 7-41 8zM899 122l55-8 81 4-48 10zM782 70l39-6 26 4-30 6z"/>
  </g>
  <path d="M-1120 307l170-23 132 25 188-43 164 37 164-24 151 40L0 316l92-22 53 13 63-34 103 21 85-20 64 21 79-21 88 6 82-27 65 8 85-46 69 10 78-34 125-9L1120 550H-1120z" fill="#ae7357" opacity=".52"/>
  <path d="M-1120 345l153-28 170 32 174-30 203 31 178-24L0 352l85-31 94 13 78-35 126 12 82-21 68 19 116-35 91 22 109-58 106 5 71-38 104-3L1120 550H-1120z" fill="url(#dune)"/>
  <path d="M-1120 370q200-29 394-9t370-5Q-160 338 0 366l89-8 116-9 120 3 108-20 90 13 136-20 112 10 91-33 145 8 113-18L1120 550H-1120z" fill="#ad7149" opacity=".48"/>
  <path d="M-1120 382q190-26 380-4t370-4Q-163 413 0 382q163-31 305-12t301-3q190-35 514-14v197H-1120z" fill="url(#ground)"/>
  <path d="M-1120 426q210-21 390 3t360-1Q-190 443 0 426q190-17 328 3t350 3q249-12 442-28v146H-1120z" fill="#5e3d2e" opacity=".38"/>
  <rect x="-1120" y="343" width="2240" height="207" fill="url(#dust)"/>
  <g fill="#d2a075" opacity=".48">
    <path d="M-1020 458l24-7 27 9-28 7zM-721 493l36-11 22 12-31 5zM-369 430l23-6 19 7-18 7zM-180 510l35-11 23 12z"/>
    <path d="M62 423l23-6 19 7-18 7zM256 448l15-5 24 4-18 9zM971 427l21-8 17 8-14 6zM1012 507l35-10 29 11-43 7zM150 511l35-11 23 12z"/>
  </g>

  <!-- Soft contact shadow is below every rover component. -->
  <ellipse cx="790" cy="468" rx="297" ry="43" fill="#211d1b" opacity=".52" filter="url(#ground-shadow)"/>

  <!-- Rover. Geometric parts share anchor points: no disconnected rods, axes or struts. -->
  <g id="rover" transform="translate(451 98) scale(1.1)" stroke-linecap="round" stroke-linejoin="round">

    <!-- Far-side bogie and wheels (visually behind the body). -->
    <g id="far-suspension" opacity=".79">
      <path d="M234 203L202 249L163 281 M202 249L317 257L317 281 M317 257L424 274"
            fill="none" stroke="#303c3a" stroke-width="17"/>
      <path d="M234 203L202 249L163 281 M202 249L317 257L317 281 M317 257L424 274"
            fill="none" stroke="#a8b1a4" stroke-width="8"/>
      <circle cx="202" cy="249" r="10" fill="#65736b" stroke="#d7ddce" stroke-width="3"/>
      <circle cx="317" cy="257" r="10" fill="#65736b" stroke="#d7ddce" stroke-width="3"/>
      <use href="#wheel" transform="translate(163 281) scale(.76)"/>
      <use href="#wheel" transform="translate(317 281) scale(.76)"/>
      <use href="#wheel" transform="translate(424 274) scale(.76)"/>
    </g>

    <!-- Unified lower load-bearing frame. Components are attached to the shell. -->
    <g id="undercarriage">
      <path d="M143 190L186 170 401 182 444 211 417 241 163 232Z"
            fill="#455350" stroke="#c0c6b8" stroke-width="4.5"/>
      <path d="M160 215L411 227" fill="none" stroke="#c9d0c0" stroke-width="5"/>
      <path d="M177 221L172 243M221 224L218 245M270 226L270 246M322 229L326 250M383 231L386 250"
            stroke="#36443f" stroke-width="5"/>
      <rect x="172" y="224" width="53" height="23" rx="4" fill="#718078" stroke="#d6dcce" stroke-width="2.5"/>
      <path d="M180 230H215M180 237H211" stroke="#3b4945" stroke-width="2.5"/>
      <rect x="339" y="229" width="47" height="25" rx="4" fill="#7c8a80" stroke="#d7ddcd" stroke-width="2.5"/>
      <path d="M346 236H378M346 244H374" stroke="#475650" stroke-width="2.5"/>
    </g>

    <!-- Angled instrument module has a real fastening plate against chassis. -->
    <g id="rear-generator">
      <path d="M428 155L461 151 475 169 448 181Z" fill="#586762" stroke="#ccd3c2" stroke-width="3"/>
      <path d="M443 129L481 136 486 181 446 174Z" fill="#a4afa4" stroke="#4c5c56" stroke-width="3.5"/>
      <path d="M452 132L453 174M464 134L465 177M476 137L477 180" stroke="#5c6d66" stroke-width="5"/>
      <ellipse cx="486" cy="159" rx="11" ry="23" fill="#87988e" stroke="#e3e6d7" stroke-width="3.5"/>
      <ellipse cx="485" cy="159" rx="5" ry="15" fill="#63726b"/>
    </g>

    <!-- Single coherent shell: white deck, chamfered edges, shaded side walls. -->
    <g id="chassis">
      <path d="M134 142L209 110 385 122 458 164 437 217 178 217 117 184Z"
            fill="url(#deck)" stroke="#4f5d59" stroke-width="5"/>
      <path d="M134 142L209 110 385 122 430 151 384 174 190 170Z"
            fill="#e1e2d6" stroke="#68756e" stroke-width="3"/>
      <path d="M117 184L178 217 437 217 458 164 384 174 190 170 134 142Z"
            fill="#88938c" opacity=".45"/>
      <path d="M190 170L384 174 437 217 178 217Z"
            fill="#a2aaa0" stroke="#5b6862" stroke-width="2.5"/>
      <path d="M193 121L363 133 326 164 171 160Z"
            fill="#84948a" stroke="#66746c" stroke-width="2.4"/>
      <path d="M202 128L339 137 318 154 194 148Z" fill="#657971"/>
      <path d="M199 136L320 144M198 145L306 153" stroke="#b8c5b7" stroke-width="2.2" opacity=".73"/>
      <path d="M137 147L180 170 178 207 128 179Z" fill="#c7cec0" stroke="#53635b" stroke-width="2.8"/>
      <path d="M378 128L430 156 416 183 372 160Z" fill="#c6cdc0" stroke="#586860" stroke-width="3"/>

      <!-- Clean side panels: repeated seams share the same baseline. -->
      <path d="M198 180L252 184 248 207 194 203Z" fill="#adb5a9" stroke="#5c6c63" stroke-width="2.2"/>
      <path d="M262 186L318 189 314 210 258 207Z" fill="#b8c0b3" stroke="#5c6c63" stroke-width="2.2"/>
      <path d="M330 192L378 196 373 212 326 210Z" fill="#98a69b" stroke="#5c6c63" stroke-width="2.2"/>
      <path d="M204 188L244 191M269 194L310 197M337 200L366 203" stroke="#e5e9d9" stroke-width="2" opacity=".73"/>
      <path d="M178 217L437 217" stroke="#e0e5d5" stroke-width="4"/>

      <!-- Fasteners follow the shell rather than float outside it. -->
      <g fill="#566660" stroke="#e9e8d9" stroke-width="2">
        <circle cx="170" cy="152" r="5"/>
        <circle cx="390" cy="160" r="5"/>
        <circle cx="190" cy="207" r="4"/>
        <circle cx="387" cy="209" r="4"/>
      </g>
    </g>

    <!-- Camera mast: fixed foot, single straight column, symmetrical support, fitted head. -->
    <g id="camera-mast">
      <path d="M238 133L238 123 266 123 266 133Z" fill="#78877d" stroke="#43524d" stroke-width="3"/>
      <path d="M252 124V58" stroke="#52635b" stroke-width="17"/>
      <path d="M252 120V62" stroke="#d8decf" stroke-width="7"/>
      <path d="M239 120L228 99 239 58M265 120L276 99 266 58"
            fill="none" stroke="#788b7e" stroke-width="4"/>
      <circle cx="252" cy="123" r="13" fill="#70847a" stroke="#dce2d1" stroke-width="4"/>
      <rect x="223" y="9" width="82" height="53" rx="6" fill="url(#metal)" stroke="#586961" stroke-width="4"/>
      <path d="M226 18H301" stroke="#fdf9e9" stroke-width="5"/>
      <rect x="227" y="43" width="73" height="14" rx="2" fill="#8a9b90"/>
      <circle cx="241" cy="35" r="11" fill="url(#glass)" stroke="#cbd4c8" stroke-width="3"/>
      <circle cx="283" cy="35" r="11" fill="url(#glass)" stroke="#cbd4c8" stroke-width="3"/>
      <circle cx="241" cy="35" r="4" fill="#1a282b"/>
      <circle cx="283" cy="35" r="4" fill="#1a282b"/>
      <circle cx="296" cy="18" r="5" fill="#aebeb1" stroke="#60736a" stroke-width="2"/>
      <circle cx="293" cy="51" r="3.5" fill="#273739" stroke="#cbd4c8" stroke-width="1.5"/>
      <path d="M306 42L329 49" fill="none" stroke="#667970" stroke-width="3.4"/>
      <circle cx="330" cy="49" r="3" fill="#8e9d90" stroke="#43514c" stroke-width="1.5"/>
    </g>

    <!-- Secondary sensor and high-gain antenna: rods end exactly at their mounts. -->
    <g id="antennae">
      <path d="M349 133L365 81" stroke="#566a61" stroke-width="7"/>
      <rect x="353" y="61" width="39" height="25" rx="4" fill="#d4dbc9" stroke="#60746b" stroke-width="3"/>
      <rect x="359" y="67" width="15" height="12" rx="2" fill="#a0b1a5"/>
      <circle cx="382" cy="73" r="5" fill="#263738"/>
      <path d="M397 145L414 83 440 76" fill="none" stroke="#60736a" stroke-width="5"/>
      <ellipse cx="440" cy="76" rx="12" ry="7" fill="#d5d8c8" stroke="#5e7065" stroke-width="3"/>
      <circle cx="440" cy="76" r="3" fill="#71867b"/>
    </g>

    <!-- Manipulator: uninterrupted two-segment arm, wrist and legible grabber. -->
    <g id="manipulator">
      <circle cx="153" cy="175" r="25" fill="#7e8d82" stroke="#dce2d2" stroke-width="4.5"/>
      <circle cx="153" cy="175" r="12" fill="#c6d1c1" stroke="#53645c" stroke-width="3"/>
      <path d="M152 178L87 212" stroke="#455651" stroke-width="31"/>
      <path d="M152 178L87 212" stroke="url(#metal)" stroke-width="21"/>
      <path d="M136 188L96 207" stroke="#f2f2e4" stroke-width="4.5"/>
      <circle cx="87" cy="212" r="18" fill="#76867b" stroke="#dce2d1" stroke-width="4"/>
      <circle cx="87" cy="212" r="8.5" fill="#bfccbc" stroke="#465a51" stroke-width="3"/>
      <path d="M85 216L35 273" stroke="#40514c" stroke-width="30"/>
      <path d="M85 216L35 273" stroke="url(#metal)" stroke-width="20"/>
      <path d="M72 232L43 265" stroke="#f0f0df" stroke-width="4.5"/>
      <path d="M153 153C113 153 92 178 78 198S52 249 33 263"
            fill="none" stroke="#334441" stroke-width="5"/>
      <path d="M153 153C113 153 92 178 78 198S52 249 33 263"
            fill="none" stroke="#c0b7a5" stroke-width="2" stroke-dasharray="4 6"/>
      <circle cx="35" cy="273" r="18" fill="#718178" stroke="#e0e4d5" stroke-width="4"/>
      <circle cx="35" cy="273" r="7" fill="#b7c4b3" stroke="#52645b" stroke-width="2.5"/>
      <path d="M20 267L-7 280 -7 303 22 298Z" fill="#a8b5a8" stroke="#51635b" stroke-width="3.5"/>
      <rect x="-37" y="282" width="31" height="19" rx="3" fill="#d3d9c9" stroke="#52645a" stroke-width="3"/>
      <path d="M-37 285L-55 285 -59 277M-37 298L-55 298 -59 306" fill="none" stroke="#d6e0d0" stroke-width="6"/>
      <path d="M-37 285L-55 285 -59 277M-37 298L-55 298 -59 306" fill="none" stroke="#52655d" stroke-width="2.5"/>
      <circle cx="-17" cy="291" r="4" fill="#62746a" stroke="#e9e9d9" stroke-width="1.4"/>
    </g>

    <!-- Visible-side rocker/bogie; arms terminate at the actual wheel hubs. -->
    <g id="near-suspension">
      <path d="M261 211L187 262 101 315M187 262L322 282M322 282L287 326M322 282L452 309"
            fill="none" stroke="#34413d" stroke-width="18"/>
      <path d="M261 211L187 262 101 315M187 262L322 282M322 282L287 326M322 282L452 309"
            fill="none" stroke="#a9b5a5" stroke-width="9"/>
      <path d="M250 220L188 261 112 308M200 264L312 281M335 286L442 306"
            fill="none" stroke="#eef0de" stroke-width="3" opacity=".82"/>
      <circle cx="261" cy="211" r="14" fill="#5c6c64" stroke="#dce2d0" stroke-width="4"/>
      <circle cx="261" cy="211" r="5" fill="#d1dcca"/>
      <circle cx="187" cy="262" r="13" fill="#68786e" stroke="#dce2d1" stroke-width="4"/>
      <circle cx="187" cy="262" r="5" fill="#becbbb"/>
      <circle cx="322" cy="282" r="13" fill="#66796e" stroke="#dce2d1" stroke-width="4"/>
      <circle cx="322" cy="282" r="5" fill="#c6d3c2"/>
      <use href="#wheel" transform="translate(101 315) rotate(-7)"/>
      <use href="#wheel" transform="translate(287 326) rotate(4)"/>
      <use href="#wheel" transform="translate(452 309) rotate(-4)"/>
    </g>
  </g>
  <path d="M0 526q178-32 339-8t331 11q202-23 450-12v33H0z" fill="#493026" opacity=".61"/>
</svg>