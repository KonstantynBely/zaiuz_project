<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 550" role="img" aria-labelledby="title description">
  <title id="title">Łazik na powierzchni Marsa</title>
  <desc id="description">Autorska ilustracja wektorowa sześciokołowego łazika badawczego z zawieszeniem rocker-bogie, kamerami na maszcie, manipulatorem i instrumentami na marsjańskiej równinie. Inspiracja konstrukcją łazików klasy Curiosity, bez odwzorowywania konkretnego egzemplarza.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#695351"/>
      <stop offset=".51" stop-color="#d99b73"/>
      <stop offset="1" stop-color="#f4c18c"/>
    </linearGradient>
    <radialGradient id="haze" cx=".66" cy=".46" r=".7">
      <stop stop-color="#ffdbad" stop-opacity=".76"/>
      <stop offset="1" stop-color="#ffdbad" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dune" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b27650"/>
      <stop offset="1" stop-color="#663b2b"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2=".25" y2="1">
      <stop stop-color="#a46942"/>
      <stop offset=".55" stop-color="#845036"/>
      <stop offset="1" stop-color="#50372c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2=".92" y2="1">
      <stop stop-color="#f8f1df"/>
      <stop offset=".25" stop-color="#dddcd0"/>
      <stop offset=".58" stop-color="#a5aaa4"/>
      <stop offset="1" stop-color="#5d6562"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2=".9">
      <stop stop-color="#eee9da"/>
      <stop offset=".5" stop-color="#b5b5a9"/>
      <stop offset="1" stop-color="#777f79"/>
    </linearGradient>
    <linearGradient id="tire" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#141b1c"/>
      <stop offset=".4" stop-color="#333c3a"/>
      <stop offset="1" stop-color="#101517"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7b8585"/>
      <stop offset=".55" stop-color="#2c3638"/>
      <stop offset="1" stop-color="#151b1e"/>
    </linearGradient>
    <filter id="ground-shadow" x="-40%" y="-50%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <pattern id="dust" width="89" height="41" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="21" r="1" fill="#f7c797" opacity=".24"/>
      <circle cx="51" cy="9" r="1.4" fill="#412b25" opacity=".21"/>
      <path d="M69 33l9-2" stroke="#efd0aa" opacity=".16"/>
    </pattern>
    <g id="wheel">
      <ellipse cy="1" rx="34" ry="45" fill="#0c1213" opacity=".36" transform="translate(8 5)"/>
      <ellipse rx="35" ry="47" fill="url(#tire)" stroke="#626962" stroke-width="2.5"/>
      <path d="M-30-26l19-8M-34-11l19-6M-35 6l21-1M-33 23l20 3M-23 38l14 6M10-43l18 7M18-29l17 11M19-10l17 8M20 11l14 7M13 29l16 6" stroke="#727973" stroke-width="4" stroke-linecap="round" opacity=".73"/>
      <ellipse rx="23" ry="36" fill="#3c4845" stroke="#9ca198" stroke-width="2.5"/>
      <ellipse rx="16" ry="26" fill="#85908a" stroke="#343d3d" stroke-width="2"/>
      <ellipse rx="11" ry="19" fill="#55615d"/>
      <path d="M-8-8L7 12M8-13L-8 9" stroke="#c7c8b8" stroke-width="2.5" opacity=".8"/>
      <circle r="5" fill="#333e3e" stroke="#d9d8ca" stroke-width="2"/>
    </g>
    <g id="bolt">
      <circle r="4.5" fill="#5b6663" stroke="#f4eedc" stroke-width="1.3"/>
      <path d="M-2 0h4" stroke="#2e3939" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Landscape: independent vector shapes, no embedded raster. -->
  <rect width="1120" height="550" fill="url(#sky)"/>
  <rect width="1120" height="550" fill="url(#haze)"/>
  <g fill="#ffe6bd" opacity=".38">
    <path d="M55 114l63-6 48 5 21 8-101-4z"/>
    <path d="M364 77l42-6 56 4-24 5z"/>
    <path d="M625 102l80-8 59 7-41 8z"/>
    <path d="M899 122l55-8 81 4-48 10z"/>
    <path d="M782 70l39-6 26 4-30 6z"/>
  </g>
  <path d="M0 316l92-22 53 13 63-34 103 21 85-20 64 21 79-21 88 6 82-27 65 8 85-46 69 10 78-34 125-9v278H0z" fill="#ae7357" opacity=".52"/>
  <path d="M0 352l85-31 94 13 78-35 126 12 82-21 68 19 116-35 91 22 109-58 106 5 71-38 104-3v349H0z" fill="url(#dune)"/>
  <path d="M0 366l89-8 116-9 120 3 108-20 90 13 136-20 112 10 91-33 145 8 113-18v248H0z" fill="#ad7149" opacity=".48"/>
  <path d="M0 382q163-31 305-12t301-3q190-35 514-14v197H0z" fill="url(#ground)"/>
  <path d="M0 426q190-17 328 3t350 3q249-12 442-28v146H0z" fill="#5e3d2e" opacity=".38"/>
  <rect y="343" width="1120" height="207" fill="url(#dust)"/>
  <g fill="#d2a075" opacity=".48">
    <path d="M62 423l23-6 19 7-18 7zM256 448l15-5 24 4-18 9zM971 427l21-8 17 8-14 6z"/>
    <path d="M1012 507l35-10 29 11-43 7zM150 511l35-11 23 12z"/>
  </g>

  <!-- Soft contact shadow is below every rover component. -->
  <ellipse cx="790" cy="468" rx="297" ry="43" fill="#211d1b" opacity=".52" filter="url(#ground-shadow)"/>

  <g transform="translate(451 98) scale(1.1)">
    <!-- Distant wheel assembly and suspension: three wheels on the other side. -->
    <g opacity=".74">
      <path d="M193 193L177 258 136 278M177 258l91 17 56-18 79 11" fill="none" stroke="#343e3e" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M194 193L178 251l-48 18M178 251l90 16 54-19 81 13" fill="none" stroke="#9b9f92" stroke-width="7" stroke-linecap="round"/>
      <use href="#wheel" transform="translate(139 296) scale(.76)"/>
      <use href="#wheel" transform="translate(276 311) scale(.78)"/>
      <use href="#wheel" transform="translate(423 294) scale(.78)"/>
    </g>

    <!-- Lower machinery: frame, gear housings, cabling. -->
    <path d="M132 188l49-22 215 13 54 34-32 30-255-10z" fill="#4e5c58" stroke="#bcc0b3" stroke-width="5"/>
    <path d="M157 224l252 8" stroke="#e0e1d0" stroke-width="5" opacity=".8"/>
    <path d="M166 222l-10 19m48-15-7 22m59-14-1 20m60-15 4 20m53-24 7 17" stroke="#394442" stroke-width="6"/>
    <rect x="170" y="223" width="57" height="25" rx="5" fill="#737e76" stroke="#d9dac8" stroke-width="3"/>
    <path d="M174 230h49m-47 8h43" stroke="#343e3d" stroke-width="3"/>
    <rect x="341" y="225" width="45" height="32" rx="5" fill="#7d8a80" stroke="#d6d9c7" stroke-width="2"/>

    <!-- Chassis top: octagonal deck, instrument bays, RTG at rear (no solar panels). -->
    <path d="M133 142l76-33 176 12 77 44-25 54-259-1-62-32z" fill="url(#deck)" stroke="#505e5c" stroke-width="5" stroke-linejoin="round"/>
    <path d="M139 143l76-26 165 11 48 29-44 22-194-4z" fill="#e1dfd3" stroke="#646f6a" stroke-width="3"/>
    <path d="M193 122l169 11-34 36-151-4z" fill="#9ca49d" stroke="#68716e" stroke-width="2"/>
    <path d="M202 125l132 9-24 27-116-3z" fill="#6e7c77"/>
    <path d="M200 133l110 7m-112 8 95 7" stroke="#bac1b4" stroke-width="2.5" opacity=".68"/>
    <path d="M145 144l37 20-5 36-34-18z" fill="#c5c8ba" stroke="#495754" stroke-width="3"/>
    <path d="M376 130l72 39-15 27-55-27z" fill="#c9cbbd" stroke="#65716c" stroke-width="3"/>
    <rect x="337" y="102" width="63" height="31" rx="5" transform="rotate(9 337 102)" fill="#d4d7c9" stroke="#63716b" stroke-width="3"/>
    <path d="M350 113l36 6m-32 4 27 5" stroke="#798981" stroke-width="3"/>
    <!-- Radioisotope generator at rear, partially occluded by deck. -->
    <g transform="translate(442 147)">
      <path d="M0-21l41 7v42l-40-7z" fill="#aeb5aa" stroke="#626d67" stroke-width="3"/>
      <path d="M12-17v40M23-15v41M34-13v42" stroke="#5c6d67" stroke-width="5"/>
      <ellipse cx="42" cy="7" rx="11" ry="21" fill="#7c8a83" stroke="#e6e5d8" stroke-width="3"/>
    </g>
    <g fill="#586761" stroke="#e5e5d6" stroke-width="2">
      <circle cx="173" cy="149" r="7"/><circle cx="390" cy="155" r="8"/>
      <circle cx="201" cy="191" r="6"/><circle cx="354" cy="199" r="6"/>
    </g>
    <path d="M201 191l132 13" stroke="#d3d8c9" stroke-width="3"/>
    <g stroke="#44504c" stroke-width="2" opacity=".77">
      <path d="M188 193l30 15m0-16 30 17m0-17 28 17m0-15 31 15"/>
    </g>

    <!-- Camera mast: paired navigation eyes, long mast, pivot and exposed wiring. -->
    <path d="M254 130L250 55" stroke="#566561" stroke-width="16" stroke-linecap="round"/>
    <path d="M252 122l-2-60" stroke="#d6d7c7" stroke-width="8"/>
    <path d="M242 126l-20-33 13-40" fill="none" stroke="#a9b2a9" stroke-width="4"/>
    <path d="M262 118l15-35-8-26" fill="none" stroke="#5d6d67" stroke-width="4"/>
    <circle cx="252" cy="121" r="14" fill="#687972" stroke="#dedfd0" stroke-width="4"/>
    <rect x="222" y="9" width="83" height="53" rx="6" fill="url(#metal)" stroke="#586561" stroke-width="4"/>
    <path d="M224 18h79" stroke="#fdf7e6" stroke-width="6" stroke-linecap="round"/>
    <rect x="225" y="41" width="76" height="16" rx="2" fill="#89958c"/>
    <g fill="url(#glass)" stroke="#c5d0c6" stroke-width="3">
      <circle cx="240" cy="36" r="11"/><circle cx="284" cy="36" r="11"/>
      <circle cx="299" cy="53" r="4"/>
    </g>
    <circle cx="240" cy="36" r="4.5" fill="#1d2529"/>
    <circle cx="284" cy="36" r="4.5" fill="#1d2529"/>
    <circle cx="296" cy="17" r="6" fill="#abb8ae" stroke="#626f68" stroke-width="2"/>
    <path d="M305 42l27 10 5-4" fill="none" stroke="#667771" stroke-width="4" stroke-linecap="round"/>
    <!-- Antenna and rectangular camera on a secondary pylon. -->
    <path d="M350 133l14-58" stroke="#687a70" stroke-width="8"/>
    <rect x="354" y="61" width="36" height="24" rx="4" fill="#d5d6c8" stroke="#677670" stroke-width="3"/>
    <circle cx="382" cy="72" r="5" fill="#273334"/>
    <path d="M397 141l17-58" stroke="#63766e" stroke-width="5"/>
    <path d="M402 86l38-10" stroke="#aeb5a9" stroke-width="4"/>
    <ellipse cx="440" cy="76" rx="12" ry="7" fill="#c9ccbc" stroke="#5a6c63" stroke-width="3"/>

    <!-- Stowed instrumentation and articulated front arm: shoulder, elbow, wrist, turret. -->
    <circle cx="154" cy="175" r="25" fill="#7c8981" stroke="#d7d9cc" stroke-width="5"/>
    <circle cx="154" cy="175" r="12" fill="#c2c9bb" stroke="#596863" stroke-width="3"/>
    <path d="M146 182L87 210" stroke="#525e5b" stroke-width="30" stroke-linecap="round"/>
    <path d="M145 181L88 209" stroke="url(#metal)" stroke-width="21" stroke-linecap="round"/>
    <path d="M131 188L95 205" stroke="#edf0df" stroke-width="5"/>
    <circle cx="87" cy="210" r="19" fill="#717d75" stroke="#dce1d0" stroke-width="5"/>
    <circle cx="87" cy="210" r="9" fill="#c8d0bd" stroke="#465650" stroke-width="3"/>
    <path d="M82 221L33 272" stroke="#4a5654" stroke-width="31" stroke-linecap="round"/>
    <path d="M82 221L34 271" stroke="url(#metal)" stroke-width="21" stroke-linecap="round"/>
    <path d="M74 231l-28 30" stroke="#f7efdc" stroke-width="5"/>
    <path d="M155 154q-42-11-77 40t-64 67" fill="none" stroke="#313c3c" stroke-width="5"/>
    <path d="M155 154q-42-11-77 40t-64 67" fill="none" stroke="#c3b4a0" stroke-width="2" stroke-dasharray="4 5"/>
    <circle cx="34" cy="273" r="18" fill="#718079" stroke="#deded0" stroke-width="4"/>
    <path d="M16 264l-35 18 2 23 38-4z" fill="#aab1a7" stroke="#53605d" stroke-width="4"/>
    <path d="M-19 282l-17-7-19 13 11 20 28-4" fill="#d5d9cb" stroke="#596762" stroke-width="4"/>
    <path d="M-20 293h-25m32-12-15-4m42 1 12 20" stroke="#485853" stroke-width="3"/>
    <circle cx="-26" cy="292" r="7" fill="#68756c" stroke="#edf0e0" stroke-width="2"/>
    <rect x="-55" y="297" width="47" height="14" rx="4" fill="#88978d" stroke="#d6dfcf" stroke-width="2"/>

    <!-- Rocker-bogie on the near side: front wheel via rocker, paired middle/rear via bogie. -->
    <path d="M261 211L181 264 101 306M181 264l141 21M322 285l-35 31m35-31 128 16"
      fill="none" stroke="#35413f" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M261 211L181 264 101 306M181 264l141 21M322 285l-35 31m35-31 128 16"
      fill="none" stroke="#afb7a9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M247 222l-61 42 109 20m26-3 103 17" fill="none" stroke="#ecedda" stroke-width="3.2" stroke-linecap="round" opacity=".82"/>
    <path d="M181 262l-23 36M322 284l-2-31" fill="none" stroke="#64736b" stroke-width="7"/>
    <use href="#bolt" x="261" y="212"/>
    <use href="#bolt" x="181" y="265"/>
    <use href="#bolt" x="322" y="284"/>
    <use href="#wheel" transform="translate(101 315) rotate(-7) scale(.99)"/>
    <use href="#wheel" transform="translate(287 326) rotate(4)"/>
    <use href="#wheel" transform="translate(452 309) rotate(-4) scale(1.03)"/>

    <!-- Instrument labels and small mechanically plausible finishing details. -->
    <path d="M298 205l43 4" stroke="#fff0d4" stroke-width="2.5" opacity=".75"/>
    <g fill="#e8c192">
      <circle cx="149" cy="174" r="2"/><circle cx="174" cy="205" r="2.5"/>
      <circle cx="338" cy="179" r="2"/><circle cx="371" cy="177" r="2.5"/>
    </g>
  </g>
  <path d="M0 526q178-32 339-8t331 11q202-23 450-12v33H0z" fill="#493026" opacity=".61"/>
</svg>
