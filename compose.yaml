services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-roversense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roversense_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-roversense}
    volumes:
      - roversense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  roversense_pgdata:
